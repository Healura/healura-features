---
# Healura ML — Feature Specification v1
# ML-side freeze proposed. Requires countersign from backend + firmware
# before this status may be changed to FROZEN.
#
# This file describes the feature set that the v1 population model
# (stress_classifier_v3.pkl) was trained on. It is the proposed contract
# between this repo, the mobile firmware, and the backend feature store.
#
# See features/_v3_actual_feature_cols.txt for the verbatim order stored
# inside the pkl artifact (alphabetically sorted by XGBoost internals).
# The canonical order below is deterministic: EDA-first (8), then ACC (6).

# v2 (Slice 1b): the feature SET is unchanged from v1 — same 14 names, same order,
# same dtypes, so spec_hash's schema section is identical. What changed is the
# feature VALUES for identical raw input:
#   (a) ACC is in g, not raw E4 counts (a 64x rescale of all 6 ACC features)
#   (b) eda_tonic_std uses ddof=0, matching the other five stds
#   (c) acc_hz is declared 4, matching what the model is actually trained on
# A v1-labelled model and a v2-labelled model are NOT comparable and must never
# be mixed. See CLAUDE.md: the bump rule covers value-changing edits, not only
# schema edits.
#
# v3 (SCR detector retune): the feature SET is again unchanged — same 14 names,
# same order, same dtypes, same window semantics — so spec_hash does NOT move.
# What changed is the VALUE of one feature for identical raw input:
#   (a) scr_peak_rate is now detected with an ABSOLUTE amplitude floor
#       (prominence >= 0.02 microsiemens) and a 3.0 s minimum inter-peak
#       interval, applied to the EDA_Phasic column with scipy.signal.find_peaks.
#       v2 read nk.eda_process's own SCR_Peaks column, whose amplitude_min
#       default is RELATIVE (10 percent of window maximum) and unreachable
#       through eda_process. See the scr_peak_rate entry below.
# No other feature changed. eda_slope, the other feature the current population
# candidate consumes, is untouched.
#
# READ THIS BEFORE COMPARING MODELS: spec_hash is byte-identical across the v2
# -> v3 bump, because the hash covers frozen_order, (name, dtype) pairs and the
# window semantics only — it does NOT cover the extraction: strings. A consumer
# that verifies spec_hash alone CANNOT detect this change. Every scr_peak_rate
# value written under v2 is a different quantity from one written under v3, and
# feature_pipeline_version is the ONLY field that says so. Pin on fpv, not hash.
#
# NOTE: this file is still named feature_spec_v1.yaml. The filename is a
# historical artifact; feature_pipeline_version below is authoritative.
feature_pipeline_version: v3
status: "PROPOSED-FROZEN (ML-side) — pending backend + firmware countersign"

countersign_required:
  - backend_feature_bundle
  - firmware_onboard_extraction

open_items:
  - "EDA-first 14-feature set must be produced by firmware + backend bundle (bundle is currently the ~4-feature defect)"
  - "60-second / 10-second-step window must be confirmed by firmware + backend (deleted live path used 10s windows)"
  - "DECISION NEEDED (Slice 1a): feature VALUES changed without a frozen_order change.
     (a) ACC is now g, not raw E4 counts — a 64x rescale of all 6 ACC features.
     (b) eda_tonic_std now uses ddof=0, matching the other five stds (was pandas ddof=1).
     CLAUDE.md requires a feature_pipeline_version bump only on feature addition,
     removal, or reorder — none of which happened — so v1 is retained here. But any
     model trained before this slice is NOT comparable to one trained after it.
     Backend + firmware must confirm whether this warrants v2 before the retrain lands."

# frozen_order: the canonical, immutable feature ordering for v1.
# This list is the authoritative input to vectorize() in features/contract.py.
# EDA features first (positions 0-7), ACC features second (positions 8-13).
# Do NOT reorder without bumping feature_pipeline_version.
frozen_order:
  - eda_mean
  - eda_phasic_max
  - eda_phasic_mean
  - eda_slope
  - eda_std
  - eda_tonic_mean
  - eda_tonic_std
  - scr_peak_rate
  - acc_magnitude_max
  - acc_magnitude_mean
  - acc_magnitude_std
  - acc_x_std
  - acc_y_std
  - acc_z_std

# spec_hash: SHA-256 over frozen_order names + (name, dtype) pairs + the
# canonical window semantics (eda_hz, acc_hz, size_seconds, step_seconds,
# eda_unit, acc_unit — see the window block below).
# Generated by scripts/hash_spec.py — do not edit by hand.
# Verify with: python scripts/hash_spec.py --check
spec_hash: "4614150debc91da4219347fb5a5cac2c01c11a225e65d6ce65208ab1c8203f2a"

features:
  # ── EDA features (8) — Electrodermal Activity at 4 Hz ─────────────────────
  - name: eda_mean
    dtype: float64
    source_signal: eda
    extraction: "np.mean of raw EDA window"

  - name: eda_phasic_max
    dtype: float64
    source_signal: eda
    extraction: "max of nk.eda_process EDA_Phasic column"

  - name: eda_phasic_mean
    dtype: float64
    source_signal: eda
    extraction: "mean of nk.eda_process EDA_Phasic column"

  - name: eda_slope
    dtype: float64
    source_signal: eda
    extraction: "scipy.stats.linregress slope over EDA window"

  - name: eda_std
    dtype: float64
    source_signal: eda
    extraction: "np.std of raw EDA window"

  - name: eda_tonic_mean
    dtype: float64
    source_signal: eda
    extraction: "mean of nk.eda_process EDA_Tonic column (SCL)"

  - name: eda_tonic_std
    dtype: float64
    source_signal: eda
    extraction: "std of nk.eda_process EDA_Tonic column"

  - name: scr_peak_rate
    dtype: float64
    source_signal: eda
    # v3: DETECTOR CHANGED. The two numeric values below are LOAD BEARING —
    # they are named explicitly in the find_peaks call in features.py
    # (SCR_MIN_PROMINENCE_MICROSIEMENS, SCR_MIN_INTERPEAK_INTERVAL_SECONDS),
    # not inherited from a library default. Changing either changes the value
    # of this feature for identical raw input.
    extraction: "scipy.signal.find_peaks over the nk.eda_process EDA_Phasic column,
      with an ABSOLUTE amplitude floor of prominence >= 0.02 microsiemens and a
      minimum inter-peak interval of 3.0 seconds (distance = 12 samples at eda_hz 4);
      count / window_minutes. v3 CHANGE: v2 read the nk.eda_process SCR_Peaks column
      instead, whose amplitude_min default of 0.1 is RELATIVE (10 percent of the
      window maximum) and is not reachable through eda_process at all. That relative
      floor collapsed on flat windows and counted baseline wander as SCRs. The floor
      is now absolute and in microsiemens and must never be made relative again."

  # ── ACC features (6) — Accelerometer in g at 4 Hz (magnitude + per-axis) ──
  # Rate-independent statistics, but calibrated to the g scale AND to the
  # 240-sample window: magnitude_max/std are sample-count sensitive.
  - name: acc_magnitude_max
    dtype: float64
    source_signal: acc
    extraction: "max of sqrt(x^2 + y^2 + z^2) per sample"

  - name: acc_magnitude_mean
    dtype: float64
    source_signal: acc
    extraction: "mean of sqrt(x^2 + y^2 + z^2) per sample"

  - name: acc_magnitude_std
    dtype: float64
    source_signal: acc
    extraction: "std of sqrt(x^2 + y^2 + z^2) per sample"

  - name: acc_x_std
    dtype: float64
    source_signal: acc
    extraction: "std of ACC x-axis"

  - name: acc_y_std
    dtype: float64
    source_signal: acc
    extraction: "std of ACC y-axis"

  - name: acc_z_std
    dtype: float64
    source_signal: acc
    extraction: "std of ACC z-axis"

deferred_to_v2:
  reason: "no BVP-bearing training data across the non-WESAD datasets; intersection logic in notebook 04 dropped HRV features"
  features:
    - name: hrv_rmssd
      source_signal: bvp
      extraction: "nk.hrv HRV_RMSSD from PPG peaks"
    - name: hrv_sdnn
      source_signal: bvp
      extraction: "nk.hrv HRV_SDNN from PPG peaks"
    - name: hrv_mean_hr
      source_signal: bvp
      extraction: "nk.hrv HRV_MeanNN from PPG peaks"
    - name: hrv_lf_hf
      source_signal: bvp
      extraction: "nk.hrv HRV_LFHF ratio from PPG peaks"

# window: the canonical window contract. Every field below EXCEPT bvp_hz feeds
# spec_hash (see scripts/hash_spec.py) — changing a rate or a unit moves the
# hash, so a downstream consumer that verifies spec_hash cannot silently drift
# on units or sample rate the way it could when the hash covered names alone.
window:
  size_seconds: 60
  step_seconds: 10
  eda_hz: 4
  bvp_hz: 64
  # acc_hz: 4, NOT 32. The v1 model has only ever seen ACC decimated to EDA
  # length: datasets/loaders.py resamples WESAD's 32 Hz ACC to len(eda) before
  # windowing, so every training ACC window was 240 rows spanning 60 s. The
  # previous value of 32 described the sensor, not the contract, and firmware
  # honouring it would have sent 1920-row windows — out of distribution for
  # acc_magnitude_max/std, which are sample-count sensitive.
  acc_hz: 4
  # Units are part of the contract. ACC is in g (1 g at rest from gravity);
  # WESAD's raw E4 counts (1 g = 64 counts) are converted at ingestion in
  # datasets/loaders.py. Sending counts to the model would be a 64x error;
  # models/predict/score.py::signal_quality_gate rejects it at runtime.
  eda_unit: microsiemens
  acc_unit: g
